name: Debian package lifecycle

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-lifecycle:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y bash ca-certificates git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust checkout in package container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compare package versions
        id: versions
        run: |
          set -eu
          previous_version=$(git show HEAD^:debian/changelog | sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p')
          current_version=$(sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p' debian/changelog)
          test -n "$previous_version"
          test -n "$current_version"
          if [ "$current_version" = "$previous_version" ]; then
            changed=false
            previous_ref=HEAD^
            for candidate in $(git rev-list --first-parent HEAD^); do
              if ! git cat-file -e "$candidate:debian/changelog" 2>/dev/null; then
                continue
              fi
              candidate_version=$(git show "$candidate:debian/changelog" | sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p')
              if [ -n "$candidate_version" ] && dpkg --compare-versions "$candidate_version" lt "$current_version"; then
                previous_version=$candidate_version
                previous_ref=$candidate
                changed=true
                break
              fi
            done
          elif dpkg --compare-versions "$current_version" gt "$previous_version"; then
            changed=true
            previous_ref=HEAD^
          else
            printf 'Package version %s is not newer than %s.\n' "$current_version" "$previous_version" >&2
            exit 1
          fi
          echo "previous=$previous_version" >> "$GITHUB_OUTPUT"
          echo "previous_ref=$previous_ref" >> "$GITHUB_OUTPUT"
          echo "current=$current_version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Run Debian release drill (build, full test suite, APT lifecycle)
        run: |
          set -eu
          args="--repo-dir $GITHUB_WORKSPACE"
          if [ "${{ steps.versions.outputs.changed }}" = "true" ]; then
            args="$args --previous-ref ${{ steps.versions.outputs.previous_ref }}"
          fi
          sh scripts/debian_release_drill.sh $args
